# PostgreSQL + API + web (nginx), optionally behind Caddy for automatic HTTPS.
#
# Local, production-like:
#   cp .env.example .env            # set SECRET_KEY and POSTGRES_PASSWORD
#   docker compose up --build -d    # -> http://localhost:8080
#
# Public server with HTTPS (DNS A record of DOMAIN points to the server):
#   set DOMAIN, CORS_ORIGINS=https://<DOMAIN> and COOKIE_SECURE=true in .env
#   docker compose --profile https up --build -d   # -> https://<DOMAIN>
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerlens
      POSTGRES_USER: ledgerlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerlens}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlens -d ledgerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (python -c "import secrets; print(secrets.token_urlsafe(48))")}
      DATABASE_URL: postgresql+psycopg://ledgerlens:${POSTGRES_PASSWORD:-ledgerlens}@db:5432/ledgerlens
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # set true behind HTTPS
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./apps/web
    ports:
      # Bound to localhost only: from the internet the app is reached through Caddy (HTTPS).
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
