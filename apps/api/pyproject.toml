[project]
name = "ledgerlens-api"
version = "0.1.0"
description = "LedgerLens API - AI-assisted receipt capture and expense intelligence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.20,<2",
  "pydantic[email]>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "argon2-cffi>=25.1,<26",
  "pyjwt>=2.14,<3",
  "anthropic>=1.6,<2",
  "python-multipart>=0.0.32",
  "psycopg[binary]>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "httpx>=0.28,<1",
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
]
# Only needed to build the Windows desktop program, see apps/desktop/README.md.
desktop = [
  "pywebview>=6.2,<7",
  "pyinstaller>=6.22,<7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"alembic/*" = ["I", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
